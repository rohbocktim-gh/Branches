name: Build Branches

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the app's game page is up to date and the generator works
        run: |
          python3 tools/build_web.py --check
          node tools/test_generator.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found - release bundle will be unsigned."
          fi

      - name: Build debug APK (for testing on your phone) and release bundle (for Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleDebug bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the end of Gradle's output as an annotation on the run page.
            python3 - "$RUNNER_TEMP/gradle.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          keep = [l for l in lines if "What went wrong" in l or l.startswith(("e: ", "> ", "ERROR", "AAPT"))]
          text = "\n".join((keep or [])[:30] + ["-----"] + lines[-40:])
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + esc)
          PY
            exit 1
          fi

      - name: Report whether the release bundle is signed
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          if jarsigner -verify "$AAB" >/dev/null 2>&1 && jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Branches Summer Delight"; then
            echo "::notice title=Release bundle signed::Signed with the Branches upload key. Ready for Play Console."
          elif [ -n "$KEYSTORE_FILE" ]; then
            echo "::error title=Release bundle not signed::The keystore secret is set but the bundle is unsigned. Check KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          else
            echo "::warning title=Release bundle unsigned::No keystore secret found, so this bundle can't go to Play."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: branches-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle (.aab for Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: branches-release-aab
          path: app/build/outputs/bundle/release/*.aab
