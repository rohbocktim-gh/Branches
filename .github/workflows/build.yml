name: Build Branches

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the app's game page is up to date and the generator works
        run: |
          python3 tools/build_web.py --check
          node tools/test_generator.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found - release bundle will be unsigned."
          fi

      - name: Build debug APK (for testing on your phone) and release bundle (for Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleDebug bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface Gradle's own error text as an annotation on the run page.
            msg=$( { sed -n '/What went wrong/,/^\* Try/p' "$RUNNER_TEMP/gradle.log"; grep -E "^e: |error:|ERROR:|AAPT" "$RUNNER_TEMP/gradle.log"; } | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: branches-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle (.aab for Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: branches-release-aab
          path: app/build/outputs/bundle/release/*.aab
