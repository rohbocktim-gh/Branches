name: Build Branches (iOS)

# Builds the iOS app for the simulator, runs it on an iPad and an iPhone, and saves
# screenshots to the ios-screenshots branch. Runs when the game page or the iOS app changes.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'app/src/main/assets/index.html'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Branches.xcodeproj -scheme Branches -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcode.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcode.log"

      - name: Show compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/xcode.log" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Run on simulators and take screenshots
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Branches.app
          BUNDLE=com.branchessummerdelight.game
          mkdir -p shots
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ids=[x['udid'] for rt,devs in sorted(d.items(), reverse=True) if 'iOS' in rt for x in devs if x['name'].startswith('$1')]
          print(ids[0] if ids else '')"
          }
          for kind in iPad iPhone; do
            DEV=$(pick $kind)
            [ -z "$DEV" ] && { echo "no $kind simulator"; continue; }
            xcrun simctl boot "$DEV" || true
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl launch "$DEV" $BUNDLE
            sleep 30
            if xcrun simctl spawn "$DEV" launchctl list | grep -q $BUNDLE; then
              echo "::notice::$kind: game still running after 30 seconds"
            else
              echo "::error::$kind: game is not running (crashed?)"
            fi
            xcrun simctl io "$DEV" screenshot "shots/$kind.png"
            xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process == "Branches"' > "shots/$kind-log.txt" 2>&1 || true
            xcrun simctl shutdown "$DEV" || true
          done

      - name: Save screenshots to the ios-screenshots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ios-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-screenshots
